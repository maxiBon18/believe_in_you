name: believe_in_you
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  riverpod: ^3.4.2
  flutter_riverpod: ^3.4.2
  package_info_plus: ^10.2.1
  flutter_launcher_icons: ^0.14.4
  get_it: ^9.2.1
  material_ui: ^1.0.0
  cupertino_ui: ^1.0.0
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Only the weights AppFonts / AppDisplayText / AppBodyText / AppMonoText ask for.
  # Adding a face here that no token uses ships bytes the app never draws.
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/lora/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/lora/Lora-SemiBold.ttf
          weight: 600
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm_sans/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/dm_sans/DMSans-Medium.ttf
          weight: 500
    - family: DM Mono
      fonts:
        - asset: assets/fonts/dm_mono/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/dm_mono/DMMono-Medium.ttf
          weight: 500
